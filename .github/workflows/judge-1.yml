name: OJ Judge Worker 1

on:
  workflow_dispatch:
    inputs:
      judge_id:
        description: '判题任务ID'
        required: true
      language:
        description: '编程语言'
        required: true
      code:
        description: '用户提交的代码'
        required: true
      testcases:
        description: '测试用例JSON'
        required: true
      config:
        description: '配置JSON'
        required: false

jobs:
  judge:
    runs-on: ubuntu-latest
    
    steps:
      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 安装依赖
        run: |
          pip install requests
      
      - name: 创建判题脚本
        run: |
          cat > judge.py << 'EOF'
          import json
          import subprocess
          import os
          import sys
          
          # 获取输入
          judge_id = "${{ github.event.inputs.judge_id }}"
          language = "${{ github.event.inputs.language }}"
          code = "${{ github.event.inputs.code }}"
          testcases = json.loads("${{ github.event.inputs.testcases }}")
          config_input = "${{ github.event.inputs.config }}" config = json.loads(config_input) if config_input else {}
          
          print(f"判题任务: {judge_id}")
          print(f"语言: {language}")
          print(f"测试用例数: {len(testcases)}")
          
          # 创建临时目录
          os.makedirs("/tmp/oj", exist_ok=True)
          
          # 根据语言处理代码
          time_limit = config.get("timeLimit", 1000) / 1000  # 转换为秒
          memory_limit = config.get("memoryLimit", 256)
          
          passed = 0
          total = len(testcases)
          results = []
          
          if language in ["cpp", "cpp17", "c"]:
              # 编译 C++ 代码
              code_file = "/tmp/oj/solution.cpp"
              exec_file = "/tmp/oj/solution"
              with open(code_file, "w") as f:
                  f.write(code)
              
              compile_result = subprocess.run(
                  ["g++", "-O2", "-o", exec_file, code_file],
                  capture_output=True,
                  text=True
              )
              
              if compile_result.returncode != 0:
                  print(f"编译错误: {compile_result.stderr}")
                  result_data = {
                      "status": "CE",
                      "message": compile_result.stderr[:500],
                      "total": total,
                      "passed": 0
                  }
                  with open("/tmp/judge_result.json", "w") as f:
                      json.dump(result_data, f)
                  sys.exit(0)
              
              # 运行测试用例
              for i, testcase in enumerate(testcases):
                  try:
                      input_data = testcase.get("input", "")
                      expected = testcase.get("output", "")
                      
                      result = subprocess.run(
                          [exec_file],
                          input=input_data,
                          capture_output=True,
                          text=True,
                          timeout=time_limit
                      )
                      
                      output = result.stdout
                      
                      if output.strip() == expected.strip():
                          passed += 1
                          results.append({"index": i, "status": "AC"})
                          print(f"测试点 {i+1}: AC")
                      else:
                          results.append({
                              "index": i, 
                              "status": "WA",
                              "expected": expected[:100],
                              "got": output[:100]
                          })
                          print(f"测试点 {i+1}: WA")
                  except subprocess.TimeoutExpired:
                      results.append({"index": i, "status": "TLE"})
                      print(f"测试点 {i+1}: TLE")
                  except Exception as e:
                      results.append({"index": i, "status": "RE", "message": str(e)})
                      print(f"测试点 {i+1}: RE - {e}")
          
          elif language in ["python", "python3"]:
              # 运行 Python 代码
              code_file = "/tmp/oj/solution.py"
              with open(code_file, "w") as f:
                  f.write(code)
              
              for i, testcase in enumerate(testcases):
                  try:
                      input_data = testcase.get("input", "")
                      expected = testcase.get("output", "")
                      
                      result = subprocess.run(
                          ["python3", code_file],
                          input=input_data,
                          capture_output=True,
                          text=True,
                          timeout=time_limit
                      )
                      
                      output = result.stdout
                      
                      if output.strip() == expected.strip():
                          passed += 1
                          results.append({"index": i, "status": "AC"})
                          print(f"测试点 {i+1}: AC")
                      else:
                          results.append({
                              "index": i,
                              "status": "WA",
                              "expected": expected[:100],
                              "got": output[:100]
                          })
                          print(f"测试点 {i+1}: WA")
                  except subprocess.TimeoutExpired:
                      results.append({"index": i, "status": "TLE"})
                      print(f"测试点 {i+1}: TLE")
                  except Exception as e:
                      results.append({"index": i, "status": "RE", "message": str(e)})
                      print(f"测试点 {i+1}: RE - {e}")
          
          else:
              print(f"不支持的语言: {language}")
              result_data = {
                  "status": "SE",
                  "message": f"Unsupported language: {language}",
                  "total": total,
                  "passed": 0
              }
              with open("/tmp/judge_result.json", "w") as f:
                  json.dump(result_data, f)
              sys.exit(0)
          
          # 确定最终状态
          if passed == total:
              final_status = "AC"
          elif passed > 0:
              final_status = "WA"
          else:
              final_status = "WA"
          
          # 保存结果
          result_data = {
              "status": final_status,
              "total": total,
              "passed": passed,
              "results": results
          }
          
          with open("/tmp/judge_result.json", "w") as f:
              json.dump(result_data, f)
          
          print(f"\n最终结果: {final_status} ({passed}/{total})")
          EOF
      
      - name: 执行判题
        run: python3 judge.py
      
      - name: 上传判题结果
        uses: actions/upload-artifact@v3
        with:
          name: judge-results
          path: /tmp/judge_result.json
