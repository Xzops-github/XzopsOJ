name: OJ Judge Worker 1

# 关键修改在这里：声明我们需要接收的 inputs
on:
  workflow_dispatch:
    inputs:
      judge_id:
        description: '判题任务ID'
        required: true
      language:
        description: '编程语言'
        required: true
      code:
        description: '用户提交的代码'
        required: true
      testcases:
        description: '测试用例JSON'
        required: true
      config:
        description: '配置JSON'
        required: false

jobs:
  run-judge:
    runs-on: ubuntu-latest
    
    steps:
      - name: 打印接收到的信息
        run: |
          echo "收到判题任务啦！"
          echo "任务 ID: ${{ github.event.inputs.judge_id }}"
          echo "语言: ${{ github.event.inputs.language }}"
          echo "代码长度: ${{ github.event.inputs.code }} 字符"
          
      - name: 模拟判题过程
        run: |
          echo "正在编译 ${{ github.event.inputs.language }} 代码..."
          echo "正在运行测试用例..."
          echo "判题完成！结果是 AC (Accepted)"
